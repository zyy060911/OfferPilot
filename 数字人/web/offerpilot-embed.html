<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OfferPilot Interviewer</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background:
                radial-gradient(circle at top, rgba(140, 87, 255, 0.18), transparent 55%),
                linear-gradient(180deg, #f8f6ff 0%, #eef4ff 100%);
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.96), rgba(225, 234, 247, 0.86) 58%, rgba(205, 218, 237, 0.9));
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            background: transparent;
        }

        audio {
            display: none;
        }

        .status {
            display: none;
        }

        .status.ready {
            background: rgba(22, 167, 106, 0.88);
        }

        .status.speaking {
            background: rgba(37, 99, 235, 0.88);
        }

        .status.error {
            background: rgba(220, 38, 38, 0.9);
        }

        .unlock-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(15, 23, 42, 0.28);
            backdrop-filter: blur(4px);
        }

        .unlock-overlay[hidden] {
            display: none;
        }

        .unlock-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: min(160px, 100%);
            padding: 16px 14px;
            color: #fff;
            text-align: center;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.72);
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.28);
        }

        .unlock-title {
            font-size: 15px;
            font-weight: 700;
        }

        .unlock-tip {
            font-size: 12px;
            line-height: 1.5;
            opacity: 0.88;
        }

        .unlock-btn {
            padding: 9px 14px;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            cursor: pointer;
        }

        .connect {
            position: absolute;
            right: 12px;
            bottom: 12px;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            box-shadow: 0 12px 28px rgba(99, 102, 241, 0.34);
            cursor: pointer;
        }

        .connect[disabled] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="stage">
        <div id="status" class="status">Offline</div>
        <div id="unlockOverlay" class="unlock-overlay" hidden>
            <div class="unlock-card">
                <div class="unlock-title">点击开启语音</div>
                <div class="unlock-tip">浏览器需要你先点一下当前数字人区域，才能播放声音。</div>
                <button id="unlockBtn" class="unlock-btn" type="button">开启语音</button>
            </div>
        </div>
        <button id="connectBtn" class="connect" type="button">Connect</button>
        <audio id="audio" autoplay></audio>
        <video id="video" autoplay playsinline muted></video>
    </div>

    <script>
        let pc = null;
        let sessionId = 0;
        let isConnecting = false;
        let isConnected = false;
        let latestSpeech = null;
        let playbackUnlocked = false;
        let pendingPlayback = false;
        let lifecycleChannel = null;
        let readyNotified = false;
        let mediaReadyNotified = false;
        let remoteAudioTrackReady = false;
        let remoteVideoFrameReady = false;
        let activeSpeechId = null;
        let activeActionRequestId = null;
        const protocolVersion = 1;
        const configuredParentOrigin = new URLSearchParams(window.location.search).get('parentOrigin');
        const parentOrigin = configuredParentOrigin || window.location.origin;

        const statusEl = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');
        const videoEl = document.getElementById('video');
        const audioEl = document.getElementById('audio');
        const unlockOverlayEl = document.getElementById('unlockOverlay');
        const unlockBtnEl = document.getElementById('unlockBtn');

        function setUnlockOverlay(visible) {
            unlockOverlayEl.hidden = !visible;
        }

        async function tryPlay(element) {
            if (!element) {
                return false;
            }

            try {
                await element.play();
                pendingPlayback = false;
                if (element === audioEl) {
                    setUnlockOverlay(false);
                }
                return true;
            } catch (error) {
                if (error && error.name === 'NotAllowedError') {
                    pendingPlayback = true;
                    if (element === audioEl) {
                        setUnlockOverlay(true);
                    }
                    notifyParent('offerpilot.embed.playbackBlocked', {});
                    return false;
                }
                console.error(error);
                return false;
            }
        }

        async function unlockPlayback() {
            playbackUnlocked = true;

            if (videoEl.srcObject) {
                await tryPlay(videoEl);
            }

            if (audioEl.srcObject) {
                const audioStarted = await tryPlay(audioEl);
                if (audioStarted && isConnected) {
                    updateStatus('Connected', 'ready');
                }
            }
        }

        async function bindRemoteMedia(element, stream) {
            element.srcObject = stream;

            if (element === audioEl) {
                remoteAudioTrackReady = Boolean(stream?.getAudioTracks?.().length);
                maybeNotifyMediaReady();
            }

            const started = await tryPlay(element);
            if (!started && element === audioEl) {
                updateStatus('Click avatar to enable audio', '');
            }
        }

        function notifyParent(type, extra) {
            if (!window.parent || window.parent === window) {
                return;
            }
            window.parent.postMessage({ type, version: protocolVersion, ...extra }, parentOrigin);
        }

        function lifecyclePayload(event, extra = {}) {
            return {
                speechId: extra.speechId || activeSpeechId,
                event,
                timestamp: extra.timestamp || new Date().toISOString(),
                ...(extra.error ? { error: String(extra.error) } : {})
            };
        }

        function forwardLifecycleEvent(payload) {
            if (!payload || !payload.speechId || !payload.event) return;
            const suffix = payload.event.replace('speech-', '');
            if (!['started', 'ended', 'error', 'interrupted'].includes(suffix)) return;
            notifyParent(`offerpilot.embed.speech.${suffix}`, lifecyclePayload(payload.event, payload));
            if (payload.speechId === activeSpeechId && ['speech-ended', 'speech-error', 'speech-interrupted'].includes(payload.event)) {
                activeSpeechId = null;
                updateStatus(isConnected ? 'Connected' : 'Offline', isConnected ? 'ready' : '');
            }
        }

        function maybeNotifyReady() {
            if (!isConnected || lifecycleChannel?.readyState !== 'open' || readyNotified) return;
            readyNotified = true;
            notifyParent('offerpilot.embed.ready', { sessionId });
            maybeNotifyMediaReady();
            if (latestSpeech) void speak(latestSpeech);
        }

        function maybeNotifyMediaReady() {
            if (
                !isConnected
                || lifecycleChannel?.readyState !== 'open'
                || !remoteAudioTrackReady
                || !remoteVideoFrameReady
                || mediaReadyNotified
            ) return;
            mediaReadyNotified = true;
            notifyParent('offerpilot.embed.media.ready', {
                sessionId,
                timestamp: new Date().toISOString(),
                audioTrackReady: true,
                videoFrameReady: true
            });
        }

        function markFirstRemoteVideoFrame() {
            if (remoteVideoFrameReady || !videoEl.srcObject) return;
            remoteVideoFrameReady = true;
            maybeNotifyMediaReady();
        }

        function updateStatus(text, tone) {
            statusEl.textContent = text;
            statusEl.className = 'status' + (tone ? ' ' + tone : '');
        }

        async function interruptTalk(speechId = null) {
            if (!sessionId) {
                throw new Error('Digital human is not connected');
            }
            const response = await fetch('/interrupt_talk', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionid: sessionId, speechId })
            });
            const result = await response.json();
            if (!response.ok || result.code !== 0) throw new Error(result.msg || 'Interrupt failed');
            return result.data || {};
        }

        async function closeSession() {
            if (!sessionId) {
                cleanup();
                return;
            }

            try {
                await fetch('/close_session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionid: sessionId })
                });
            } catch (error) {
                console.error(error);
            } finally {
                sessionId = 0;
                isConnected = false;
                cleanup();
            }
        }

        async function speak(payload) {
            latestSpeech = payload;
            if (!payload || !payload.text || !payload.speechId) {
                return;
            }
            if (!isConnected || lifecycleChannel?.readyState !== 'open') {
                updateStatus('Waiting for connect', '');
                return;
            }

            activeSpeechId = payload.speechId;
            try {
                const response = await fetch('/human', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: payload.text,
                        type: 'echo',
                        interrupt: true,
                        sessionid: sessionId,
                        speechId: payload.speechId
                    })
                });
                const result = await response.json();
                if (!response.ok || result.code !== 0) {
                    throw new Error(result.msg || 'Speak failed');
                }
                const acceptedSpeechId = result.data?.speechId || payload.speechId;
                if (acceptedSpeechId !== payload.speechId) {
                    throw new Error('Speech ID mismatch');
                }
                if (latestSpeech?.speechId === payload.speechId) latestSpeech = null;
                notifyParent('offerpilot.embed.speech.accepted', lifecyclePayload('speech-accepted', {
                    speechId: payload.speechId
                }));
                if (activeSpeechId === payload.speechId) updateStatus('Preparing speech', 'speaking');
            } catch (error) {
                if (activeSpeechId === payload.speechId) activeSpeechId = null;
                notifyParent('offerpilot.embed.speech.error', lifecyclePayload('speech-error', {
                    speechId: payload.speechId,
                    error: error?.message || error
                }));
                throw error;
            }
        }

        async function setAvatarAction(payload) {
            if (!payload?.requestId || typeof payload.action !== 'string') return;
            activeActionRequestId = payload.requestId;
            try {
                if (!isConnected) throw new Error('Digital human is not connected');
                const response = await fetch('/set_audiotype', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionid: sessionId,
                        action: payload.action,
                        requestId: payload.requestId
                    })
                });
                const result = await response.json();
                if (!response.ok || result.code !== 0) throw new Error(result.msg || 'Action change failed');
                if (activeActionRequestId !== payload.requestId) return;
                activeActionRequestId = null;
                const actionResult = result.data || {};
                notifyParent(
                    actionResult.applied ? 'offerpilot.embed.action.applied' : 'offerpilot.embed.action.fallback',
                    {
                        requestId: payload.requestId,
                        requestedAction: payload.action,
                        appliedAction: actionResult.appliedAction || 'NEUTRAL',
                        applied: Boolean(actionResult.applied),
                        reason: actionResult.reason || null,
                        capabilities: actionResult.capabilities || [],
                        timestamp: new Date().toISOString()
                    }
                );
            } catch (error) {
                if (activeActionRequestId !== payload.requestId) return;
                activeActionRequestId = null;
                notifyParent('offerpilot.embed.action.error', {
                    requestId: payload.requestId,
                    requestedAction: payload.action,
                    appliedAction: 'NEUTRAL',
                    error: String(error?.message || error),
                    timestamp: new Date().toISOString()
                });
            }
        }

        async function negotiate() {
            pc.addTransceiver('video', { direction: 'recvonly' });
            pc.addTransceiver('audio', { direction: 'recvonly' });

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            await new Promise((resolve) => {
                if (pc.iceGatheringState === 'complete') {
                    resolve();
                    return;
                }
                const checkState = () => {
                    if (pc.iceGatheringState === 'complete') {
                        pc.removeEventListener('icegatheringstatechange', checkState);
                        resolve();
                    }
                };
                pc.addEventListener('icegatheringstatechange', checkState);
            });

            const response = await fetch('/offer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sdp: pc.localDescription.sdp,
                    type: pc.localDescription.type
                })
            });

            const answer = await response.json();
            sessionId = answer.sessionid || 0;
            await pc.setRemoteDescription(answer);
        }

        async function connect() {
            if (isConnecting || isConnected) {
                return;
            }

            isConnecting = true;
            connectBtn.disabled = true;
            updateStatus('Connecting...', '');

            try {
                pc = new RTCPeerConnection({ sdpSemantics: 'unified-plan' });
                lifecycleChannel = pc.createDataChannel('offerpilot.lifecycle', { ordered: true });
                lifecycleChannel.addEventListener('open', maybeNotifyReady);
                lifecycleChannel.addEventListener('message', (event) => {
                    try {
                        forwardLifecycleEvent(JSON.parse(event.data));
                    } catch (error) {
                        console.error('Invalid speech lifecycle event', error);
                    }
                });
                lifecycleChannel.addEventListener('error', () => {
                    if (activeSpeechId) {
                        notifyParent('offerpilot.embed.speech.error', lifecyclePayload('speech-error', {
                            error: '数字人生命周期通道异常'
                        }));
                    }
                });
                pc.addEventListener('track', (event) => {
                    if (event.track.kind === 'video') {
                        void bindRemoteMedia(videoEl, event.streams[0]);
                        if (typeof videoEl.requestVideoFrameCallback === 'function') {
                            videoEl.requestVideoFrameCallback(() => markFirstRemoteVideoFrame());
                        }
                    } else {
                        void bindRemoteMedia(audioEl, event.streams[0]);
                    }
                });
                pc.addEventListener('connectionstatechange', () => {
                    if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected' || pc.connectionState === 'closed') {
                        isConnected = false;
                        connectBtn.disabled = false;
                        connectBtn.textContent = 'Reconnect';
                        updateStatus('Disconnected', 'error');
                        notifyParent('offerpilot.embed.disconnected', {});
                    }
                });

                await negotiate();

                isConnected = true;
                connectBtn.textContent = 'Connected';
                updateStatus('Connected', 'ready');
                maybeNotifyReady();
            } catch (error) {
                console.error(error);
                updateStatus('Connect failed', 'error');
                connectBtn.disabled = false;
                connectBtn.textContent = 'Reconnect';
            } finally {
                isConnecting = false;
            }
        }

        function cleanup() {
            readyNotified = false;
            mediaReadyNotified = false;
            remoteAudioTrackReady = false;
            remoteVideoFrameReady = false;
            latestSpeech = null;
            activeSpeechId = null;
            activeActionRequestId = null;
            if (lifecycleChannel) {
                lifecycleChannel.close();
                lifecycleChannel = null;
            }
            if (pc) {
                const currentPc = pc;
                pc = null;
                setTimeout(() => currentPc.close(), 0);
            }
            audioEl.srcObject = null;
            videoEl.srcObject = null;
        }

        connectBtn.addEventListener('click', connect);
        videoEl.addEventListener('loadeddata', markFirstRemoteVideoFrame);
        videoEl.addEventListener('canplay', markFirstRemoteVideoFrame);
        unlockBtnEl.addEventListener('click', () => {
            void unlockPlayback();
        });
        ['pointerdown', 'keydown', 'touchstart'].forEach((eventName) => {
            window.addEventListener(eventName, () => {
                if (!playbackUnlocked || pendingPlayback) {
                    void unlockPlayback();
                }
            }, { passive: true });
        });
        window.addEventListener('load', () => {
            void connect();
        });

        window.addEventListener('message', async (event) => {
            if (event.source !== window.parent || event.origin !== parentOrigin) return;
            const data = event.data || {};
            if (data.type === 'offerpilot.speak' && typeof data.text === 'string') {
                const text = data.text.trim();
                if (!text) {
                    return;
                }
                try {
                    await speak({ key: data.key || '', speechId: data.speechId, text });
                } catch (error) {
                    console.error(error);
                    updateStatus('播报失败', 'error');
                }
            }

            if (data.type === 'offerpilot.action.set' && data.version === protocolVersion) {
                await setAvatarAction({ action: data.action, requestId: data.requestId });
            }

            if (data.type === 'offerpilot.speech.interrupt' && data.version === protocolVersion) {
                if (!data.speechId || data.speechId !== activeSpeechId) return;
                try {
                    await interruptTalk(data.speechId);
                    updateStatus('Stopping speech', 'speaking');
                } catch (error) {
                    notifyParent('offerpilot.embed.speech.error', lifecyclePayload('speech-error', {
                        speechId: data.speechId,
                        error: error?.message || error
                    }));
                }
            }

            if (data.type === 'offerpilot.stop') {
                try {
                    await interruptTalk(activeSpeechId);
                    updateStatus(isConnected ? 'Connected' : 'Offline', isConnected ? 'ready' : '');
                } catch (error) {
                    console.error(error);
                }
            }

            if (data.type === 'offerpilot.close') {
                await closeSession();
            }

            if (data.type === 'offerpilot.unlockAudio') {
                await unlockPlayback();
            }
        });

        window.addEventListener('beforeunload', () => {
            void closeSession();
        });
    </script>
</body>
</html>
